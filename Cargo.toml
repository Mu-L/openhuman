# Virtual workspace root. OpenHuman's implementation remains in `src/` while
# the Cargo package manifest lives under `crates/openhuman-core`. Vendored
# module workspaces are excluded so their workspace-inherited keys continue to
# resolve against their own roots.
[workspace]
resolver = "2"
members = ["crates/openhuman-core", "crates/openhuman-embed", "crates/openhuman-tui"]
exclude = [
    "vendor",
    "worktrees",
    "crates/openhuman-app",
    "app/src-tauri-mobile",
    "packages/tauri-plugin-ptt",
]

[workspace.package]
version = "0.63.25"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/openhuman"

[workspace.dependencies]
openhuman-core = { path = "crates/openhuman-core", package = "openhuman" }

# Patches are workspace-root settings; Cargo ignores them in member manifests.
[patch."https://github.com/tinyhumansai/tinymemory"]
tinymemory-api = { path = "vendor/tinymemory/crates/tinymemory-api" }

[patch."https://github.com/tinyhumansai/tinyinference"]
tinyinference = { path = "vendor/tinyagents/vendor/tinyinference/crates/tinyinference" }

[patch.crates-io]
motosan-ai-oauth = { path = "vendor/motosan-ai-oauth" }
tinyinference = { path = "vendor/tinyagents/vendor/tinyinference/crates/tinyinference" }
tinyflows = { path = "vendor/tinyflows/crates/tinyflows" }
tinychannels = { path = "vendor/tinychannels" }

# Emit enough release DWARF for server-side Sentry symbolication while keeping
# shipped binaries small. The CI profile deliberately disables LTO/debug info.
[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.ci]
inherits = "release"
opt-level = 1
codegen-units = 16
lto = false
incremental = false
strip = true
debug = false

[profile.dev.package."*"]
debug = false
